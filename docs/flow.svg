<rect x="40" y="70" width="300" height="62" rx="6" fill="white" stroke="#444"/>
<text x="190.0" y="97" text-anchor="middle" font-weight="bold">P1 Prerequisites</text>
<text x="190.0" y="116" text-anchor="middle">account, Keychain, config</text>
<rect x="40" y="162" width="300" height="100" rx="6" fill="white" stroke="#444"/>
<text x="190.0" y="189" text-anchor="middle" font-weight="bold">P2 Preflight</text>
<text x="190.0" y="208" text-anchor="middle">connection, privileges,</text>
<text x="190.0" y="227" text-anchor="middle">layout, storage IDs,</text>
<text x="190.0" y="246" text-anchor="middle">workspace questions</text>
<rect x="40" y="292" width="300" height="81" rx="6" fill="white" stroke="#444"/>
<text x="190.0" y="319" text-anchor="middle" font-weight="bold">P3 Profile</text>
<text x="190.0" y="338" text-anchor="middle">inventory, routines, reference tables,</text>
<text x="190.0" y="357" text-anchor="middle">estimate, pipeline credentials asked</text>
<rect x="40" y="403" width="300" height="62" rx="6" fill="#fff7d6" stroke="#444"/>
<text x="190.0" y="430" text-anchor="middle" font-weight="bold">P4 Plan</text>
<text x="190.0" y="449" text-anchor="middle">window, owners, names</text>
<rect x="400" y="70" width="380" height="62" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="97" text-anchor="middle" font-weight="bold">O1 Start</text>
<text x="590.0" y="116" text-anchor="middle">names confirmed, go decision</text>
<rect x="400" y="162" width="380" height="62" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="189" text-anchor="middle" font-weight="bold">O2 Stop pipelines</text>
<text x="590.0" y="208" text-anchor="middle">capture offsets</text>
<rect x="400" y="254" width="380" height="81" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="281" text-anchor="middle" font-weight="bold">O3 Freeze</text>
<text x="590.0" y="300" text-anchor="middle">detach, attach READ ONLY,</text>
<text x="590.0" y="319" text-anchor="middle">write probe</text>
<rect x="400" y="365" width="380" height="62" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="392" text-anchor="middle" font-weight="bold">O4 Freeze capture</text>
<text x="590.0" y="411" text-anchor="middle">inventory, drift, copy plan</text>
<rect x="400" y="457" width="380" height="62" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="484" text-anchor="middle" font-weight="bold">O5 Create replacement</text>
<text x="590.0" y="503" text-anchor="middle">layout, tables, functions, aggregates</text>
<rect x="400" y="549" width="380" height="81" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="576" text-anchor="middle" font-weight="bold">O6 Copy</text>
<text x="590.0" y="595" text-anchor="middle">chunks, journal, resume,</text>
<text x="590.0" y="614" text-anchor="middle">one retry round, staging for reference tables</text>
<rect x="400" y="660" width="380" height="62" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="687" text-anchor="middle" font-weight="bold">O7 Post-copy</text>
<text x="590.0" y="706" text-anchor="middle">views, procedures, counters, stale check</text>
<rect x="400" y="752" width="380" height="81" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="779" text-anchor="middle" font-weight="bold">O8 Verify</text>
<text x="590.0" y="798" text-anchor="middle">counts, newest, fingerprints</text>
<text x="590.0" y="817" text-anchor="middle">in parallel, sampled over 1 B rows</text>
<rect x="400" y="863" width="380" height="62" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="890" text-anchor="middle" font-weight="bold">O9 Pipelines</text>
<text x="590.0" y="909" text-anchor="middle">create stopped at offsets</text>
<rect x="400" y="955" width="380" height="100" rx="6" fill="#fff7d6" stroke="#444"/>
<text x="590.0" y="982" text-anchor="middle" font-weight="bold">O10 Switch</text>
<text x="590.0" y="1001" text-anchor="middle">S1 detach, S2 retain, S2b drop original record,</text>
<text x="590.0" y="1020" text-anchor="middle">S3 attach live, S4 drop replacement</text>
<text x="590.0" y="1039" text-anchor="middle">ends with two entries</text>
<rect x="400" y="1085" width="380" height="81" rx="6" fill="white" stroke="#444"/>
<text x="590.0" y="1112" text-anchor="middle" font-weight="bold">O11 Release</text>
<text x="590.0" y="1131" text-anchor="middle">start pipelines,</text>
<text x="590.0" y="1150" text-anchor="middle">application restart</text>
<rect x="1150" y="70" width="300" height="43" rx="6" fill="white" stroke="#444"/>
<text x="1300.0" y="97" text-anchor="middle" font-weight="bold">C1 Verify after release</text>
<rect x="1150" y="143" width="300" height="62" rx="6" fill="white" stroke="#444"/>
<text x="1300.0" y="170" text-anchor="middle" font-weight="bold">C2 Report</text>
<text x="1300.0" y="189" text-anchor="middle">retain-until date recorded</text>
<rect x="1150" y="235" width="300" height="62" rx="6" fill="white" stroke="#444"/>
<text x="1300.0" y="262" text-anchor="middle" font-weight="bold">C3 End state</text>
<text x="1300.0" y="281" text-anchor="middle">two entries</text>
<rect x="1150" y="327" width="300" height="43" rx="6" fill="white" stroke="#444"/>
<text x="1300.0" y="354" text-anchor="middle" font-weight="bold">C4 Remove migration account</text>
<rect x="1150" y="400" width="300" height="62" rx="6" fill="white" stroke="#444" stroke-dasharray="6 4"/>
<text x="1300.0" y="427" text-anchor="middle" font-weight="bold">C5 Delete the retained original</text>
<text x="1300.0" y="446" text-anchor="middle">later, by the customer (s2rebuild cleanup)</text>
<rect x="818" y="964" width="300" height="81" rx="6" fill="white" stroke="#444"/>
<text x="968.0" y="991" text-anchor="middle" font-weight="bold">Rollback</text>
<text x="968.0" y="1010" text-anchor="middle">original by syntax before S2b,</text>
<text x="968.0" y="1029" text-anchor="middle">through the retained copy after</text>
</g></svg>
